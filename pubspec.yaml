name: fintech_wallet
description: Offline-first multi-currency wallet built with Flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  bloc_concurrency: ^0.3.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  dio: ^5.11.1
  # drift_dev 2.35 conflicts with the test_api pinned by flutter_test.
  drift: ">=2.34.0 <2.35.0"
  drift_flutter: ^0.3.1
  equatable: ^2.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  intl: ^0.20.2
  local_auth: ^3.0.2
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ">=2.34.0 <2.35.0"
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
